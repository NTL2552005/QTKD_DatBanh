{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Phân trang đơn hàng">
    {% if page_obj.has_previous %}<a class="button button-outline button-small" href="?{{ pagination_query }}{% if pagination_query %}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Trang trước</a>{% endif %}
    <span>Trang {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="button button-outline button-small" href="?{{ pagination_query }}{% if pagination_query %}&amp;{% endif %}page={{ page_obj.next_page_number }}">Trang sau</a>{% endif %}
</nav>
{% endif %}
